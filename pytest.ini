[pytest]
pythonpath = .
testpaths = tests
addopts = -ra
markers =
    database: requires TEST_DATABASE_URL pointing to disposable PostgreSQL
# The portal's tests are `async def`, because the routes are. `auto` mode means a
# test does not have to carry a decorator to say what its own signature already
# says. The option is inert under the bot's virtualenv, which has no
# pytest-asyncio and does not collect `tests/web` (see tests/conftest.py).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# A SQLAlchemy deprecation is a compatibility defect in the next minor release, so
# it fails the suite rather than scrolling past in the warnings summary. (2.1
# deprecated `select().distinct(expr)` for DISTINCT ON; the repository now uses
# the PostgreSQL `distinct_on` extension.)
filterwarnings =
    error::sqlalchemy.exc.SADeprecationWarning

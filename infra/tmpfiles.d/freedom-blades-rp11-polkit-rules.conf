# Freedom Blades Route 3 (RP-11): the two runtime directories Polkit must find
# at its own start. polkitd reads /run/polkit-1/rules.d only if it existed when
# polkitd started, so these entries are created by systemd-tmpfiles-setup, which
# is ordered before polkit.service. This fragment owns these two directories and
# nothing else: no rule, grant, record, evidence path or unit.
#
# Installed by `python -m tools.polkit_tmpfiles install` into the package layer.
d /run/polkit-1 0755 root root -
d /run/polkit-1/rules.d 0755 root root -
